notes: >-
  Lightrun does not emit RFC 9457 application/problem+json. Errors are plain JSON
  keyed on a `message` field (the docs give `{"message": "401 Unauthorized"}` as the
  canonical unauthorized body) and carry the meaning in the HTTP status code. Several
  operations reuse the success schema for their 4xx responses, so the status code —
  not the body shape — is the discriminator.
