aid: lightrun
name: Lightrun
description: >-
  Lightrun is a developer-native observability and live-debugging platform. Language agents
  embedded in a running JVM, Python, Node.js or .NET process accept dynamic actions — logs,
  snapshots, counters, tic-toc timings and custom metrics — placed on a file and line while
  the application keeps serving traffic, so engineers can inspect production behavior without
  redeploying, restarting or attaching a traditional debugger. The platform is driven from
  JetBrains, VS Code and Visual Studio plugins, a Java CLI, a bearer-authenticated Public REST
  API, and a published MCP server that gives AI coding assistants live runtime context. Around
  that core it adds agent-pool RBAC, PII redaction, SSO and SCIM provisioning, and a Dynamic
  SBOM surface that reports which third-party packages are actually reachable at runtime.
